name: Render feasibility Figure 2
on:
  push:
    branches: [scg-figure2-generated]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting requirements
        run: python -m pip install numpy matplotlib geopandas shapely pyogrio
      - name: Render notebook with unchanged boundary plotting
        run: |
          python -c "from pathlib import Path; p=Path('render_scg_figure2.py'); s=p.read_text(); p.write_text(s.replace(chr(92)+'nplt.savefig',chr(10)+'plt.savefig'))"
          python render_scg_figure2.py
      - uses: actions/upload-artifact@v4
        with:
          name: SCG-Figure-2-GitHub-notebook
          path: |
            outputs/SCG_Figure2_notebook.png
            outputs/SCG_Figure2_notebook.pdf
            outputs/SCG_Figure2_notebook.svg
          retention-days: 15
      - name: Save generated figure on working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/SCG_Figure2_notebook.png outputs/SCG_Figure2_notebook.pdf outputs/SCG_Figure2_notebook.svg
          git diff --cached --quiet || (git commit -m "Render SCG Figure 2 with original notebook boundaries" && git push)
